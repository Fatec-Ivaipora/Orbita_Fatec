<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPA - Órbita FATEC</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="stylesheet" href="/core/layout.css">
    <link rel="stylesheet" href="/cpa/cpa.css?v=11">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="pagina-cpa">
    <!-- Auth Guard Padrão -->
    <div id="auth-guard" class="layout-auth-guard">
        <div class="layout-spinner"></div>
        <h3 style="color:var(--text-main); font-weight:600;">Autenticando...</h3>
    </div>

    <div id="app" class="layout-wrapper hidden">
        <main class="layout-main">
            <div class="layout-content" id="cpa-root">
                <div class="page-header no-print">
                    <div>
                        <h1 class="page-title">CPA</h1>
                        <p class="page-subtitle">Resultado das respostas dos alunos, um gráfico por dimensão do SINAES</p>
                    </div>
                    <div class="page-header-actions">
                        <button type="button" class="btn-primary" id="btn-imprimir" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                            Imprimir
                        </button>
                    </div>
                </div>

                <div class="filters-bar no-print">
                    <select class="select-filter" id="select-campanha">
                        <option value="">Selecione a campanha...</option>
                    </select>
                    <select class="select-filter" id="select-curso" disabled>
                        <option value="">Selecione o curso...</option>
                    </select>
                </div>

                <p class="empty-state no-print" id="empty-state">Escolha uma campanha e um curso para ver o relatório.</p>

                <div class="print-page hidden" id="print-page">
                    <div class="rel-cabecalho-print">
                        <div>
                            <h1 id="print-titulo">CPA</h1>
                            <p id="print-curso-label"></p>
                        </div>
                        <div class="rel-data-emissao" id="print-data-emissao"></div>
                    </div>

                    <div id="dimensoes-container"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast hidden"></div>

    <div id="modal-comentarios" class="modal-overlay hidden">
        <div class="modal-content modal-content-lg">
            <h2 id="modal-comentarios-titulo">Comentários</h2>
            <div class="comentarios-filtro-tabs" id="comentarios-filtro-tabs"></div>
            <div class="comentarios-lista-modal" id="comentarios-lista-modal"></div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="btn-fechar-modal-comentarios">Fechar</button>
            </div>
        </div>
    </div>

    <script type="module" src="/cpa/app.js?v=11"></script>
</body>
</html>
