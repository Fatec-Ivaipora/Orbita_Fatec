<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluno Indica - Matrículas - Órbita FATEC</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="stylesheet" href="/core/layout.css">
    <link rel="stylesheet" href="/financeiro/matriculas/matriculas.css">
</head>
<body class="pagina-relatorio">
    <!-- Auth Guard Padrão -->
    <div id="auth-guard" class="layout-auth-guard">
        <div class="layout-spinner"></div>
        <h3 style="color:var(--text-main); font-weight:600;">Autenticando...</h3>
    </div>

    <div id="app" class="layout-wrapper hidden">
        <main class="layout-main">
            <div class="layout-content" id="matriculas-aluno-indica-root">
                <div class="page-header no-print">
                    <div>
                        <h1 class="page-title">Aluno Indica</h1>
                        <p class="page-subtitle">Quem já indicou calouro neste módulo/semestre, quantos e quem</p>
                    </div>
                    <div class="page-header-actions">
                        <a class="btn-secondary" href="/financeiro/matriculas/index.html">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                            Voltar
                        </a>
                        <button type="button" class="btn-primary" id="btn-imprimir-indica">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                            Imprimir
                        </button>
                    </div>
                </div>

                <div class="filters-bar no-print">
                    <select class="select-filter" id="indica-modulo-select">
                        <option value="fatec">Fatec (16 cursos)</option>
                        <option value="medicina">Medicina</option>
                    </select>
                    <select class="select-filter" id="indica-semestre-select">
                        <option value="2026.1">2026.1</option>
                        <option value="2026.2" selected>2026.2</option>
                    </select>
                    <select class="select-filter" id="indica-curso-select">
                        <option value="">Todos os cursos</option>
                    </select>
                </div>

                <div class="print-page">
                <div class="rel-cabecalho-print">
                    <div>
                        <h1>Aluno Indica</h1>
                        <p id="print-filtro-label-indica">Fatec — 2026.2</p>
                    </div>
                    <div class="rel-data-emissao" id="print-data-emissao"></div>
                </div>

                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-label">Alunos que indicaram</div>
                        <div class="kpi-value" id="indica-kpi-veteranos">—</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Total de indicações</div>
                        <div class="kpi-value" id="indica-kpi-total">—</div>
                    </div>
                </div>

                <div class="card">
                    <h3 class="card-secao-titulo">Ranking de quem indicou</h3>
                    <div class="tabela-wrap">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Veterano</th>
                                    <th>Quantos indicou</th>
                                    <th>Quem foi</th>
                                </tr>
                            </thead>
                            <tbody id="indica-tbody">
                                <tr><td colspan="3" class="tabela-msg">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="/financeiro/matriculas/app.js"></script>
</body>
</html>
