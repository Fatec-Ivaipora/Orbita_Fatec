<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Matrículas - Órbita FATEC</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="stylesheet" href="/core/layout.css">
    <link rel="stylesheet" href="/financeiro/matriculas/matriculas.css">
</head>
<body>
    <!-- Auth Guard Padrão -->
    <div id="auth-guard" class="layout-auth-guard">
        <div class="layout-spinner"></div>
        <h3 style="color:var(--text-main); font-weight:600;">Autenticando...</h3>
    </div>

    <div id="app" class="layout-wrapper hidden">
        <main class="layout-main">
            <div class="layout-content" id="matriculas-root">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Relatório Matrículas</h1>
                        <p class="page-subtitle">Cadastro de situação de matrícula/rematrícula por curso e semestre</p>
                    </div>
                    <div class="page-header-actions">
                        <a class="btn-secondary" id="link-relatorio" href="/financeiro/matriculas/relatorio.html">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-4 4"/></svg>
                            Relatório
                        </a>
                        <button class="btn-primary" id="btn-novo-aluno" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Novo Aluno
                        </button>
                    </div>
                </div>

                <div class="filters-bar">
                    <select class="select-filter" id="modulo-select">
                        <option value="fatec">Fatec (16 cursos)</option>
                        <option value="medicina">Medicina</option>
                    </select>
                    <select class="select-filter" id="semestre-select">
                        <option value="2026.1">2026.1</option>
                        <option value="2026.2" selected>2026.2</option>
                    </select>
                    <select class="select-filter" id="curso-select">
                        <option value="">Todos os cursos</option>
                    </select>
                    <select class="select-filter" id="periodo-filtro">
                        <option value="">Todos os períodos</option>
                    </select>
                    <select class="select-filter" id="situacao-filtro">
                        <option value="">Todas as situações</option>
                    </select>
                    <select class="select-filter" id="plano-filtro">
                        <option value="">Todos os planos/confissão</option>
                    </select>
                    <div class="search-wrap">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" class="search-input" id="busca-aluno" placeholder="Buscar aluno pelo nome...">
                    </div>
                </div>

                <div class="card">
                    <div class="tabela-wrap alunos-scroll">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Curso</th>
                                    <th>Período</th>
                                    <th>Cidade</th>
                                    <th>Situação</th>
                                    <th>Plano/Confissão</th>
                                    <th>Telefone</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="alunos-tbody">
                                <tr><td colspan="8" class="tabela-msg">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="carregar-mais-wrap hidden" id="carregar-mais-wrap">
                        <button type="button" class="btn-secondary" id="btn-carregar-mais">Carregar mais</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Novo/Editar Aluno -->
    <div id="modal-aluno" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modal-aluno-title">Novo Aluno</h2>
            <form id="form-aluno">
                <input type="hidden" id="aluno-id">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="aluno-nome" required>
                </div>
                <div class="form-row">
                    <div class="form-group" id="grupo-curso-aluno">
                        <label>Curso</label>
                        <select id="aluno-curso"></select>
                    </div>
                    <div class="form-group">
                        <label>Período</label>
                        <input type="text" id="aluno-periodo" placeholder="1º, 2º...">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Cidade</label>
                        <input type="text" id="aluno-cidade">
                    </div>
                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="text" id="aluno-telefone">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Situação</label>
                        <select id="aluno-situacao" required></select>
                    </div>
                    <div class="form-group">
                        <label>Plano/Confissão</label>
                        <select id="aluno-plano"></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Observações</label>
                    <textarea id="aluno-observacoes" placeholder="Observações da coordenação/financeiro"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="btn-cancelar-aluno">Cancelar</button>
                    <button type="submit" class="btn-primary" id="btn-salvar-aluno">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="/financeiro/matriculas/app.js"></script>
</body>
</html>
