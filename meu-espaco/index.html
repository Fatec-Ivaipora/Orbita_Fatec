<!DOCTYPE html>
<!-- Deploy Timestamp: 2026-05-06T20:04:00Z -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Processos · Órbita Fatec</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/core/layout.css">
  <link rel="stylesheet" href="/meu-espaco/meu-espaco.css">
</head>
<body>
  <div class="particles"></div>

  <!-- Auth Guard Padrão -->
  <div id="auth-guard" class="layout-auth-guard">
    <div class="layout-spinner"></div>
    <h3 style="color:var(--text-main); font-weight:600;">Autenticando...</h3>
  </div>

  <div id="app" class="layout-wrapper hidden">
    <!-- Sidebar e Header injetados via layout.js -->
    <div class="layout-main">
      <div class="layout-content">

        <main class="mod-main" id="main-content">
          <div class="welcome-section">
            <h1 class="page-title">Meus Processos</h1>
            <p class="page-subtitle">Sua agenda da semana — o que você marcou e o que o chefe do setor atribuiu pra você, dia a dia.</p>
          </div>

          <!-- Quadro de Avisos: mural de post-its do setor. Composer só aparece
               pra Chefe de Setor/ADM; o mural em si aparece pra todo mundo. -->
          <section id="avisos-section" class="avisos-section hidden">
            <div class="section-header">
              <div class="header-title">
                <span class="icon">📌</span>
                <h2>Quadro de Avisos</h2>
              </div>
            </div>

            <div id="aviso-composer" class="aviso-composer hidden">
              <textarea id="aviso-texto" class="form-input" rows="2" placeholder="Deixe um aviso pra equipe..."></textarea>
              <div class="aviso-composer-footer">
                <div class="aviso-cor-opcoes" id="aviso-cor-opcoes"></div>
                <button type="button" id="btn-publicar-aviso" class="btn btn-primary btn-sm">Publicar aviso</button>
              </div>
            </div>

            <div id="avisos-mural" class="avisos-mural"></div>
          </section>

          <!-- Painel do Setor: só para Chefe de Setor / ADM. Renderizado via JS -->
          <section id="gestor-panel" class="gestor-panel hidden">
            <div class="section-header">
              <div class="header-title">
                <span class="icon">📊</span>
                <h2>Painel do Setor</h2>
              </div>
              <div id="proc-setor-select-wrap" class="hidden"></div>
            </div>
            <div id="setor-progresso-list" class="setor-progresso-list">
              <div class="loading-state">Carregando progresso do setor...</div>
            </div>

            <div id="agenda-setor-wrap" class="hidden">
              <h3 class="card-secao-titulo" style="padding:1.5rem 0 0.75rem;">Agenda do setor (semana atual do quadro abaixo)</h3>
              <div id="agenda-setor" class="agenda-setor"></div>
            </div>
          </section>

          <!-- Minhas Atividades (agenda semanal) -->
          <section class="activities-section">
            <div class="section-header">
              <div class="header-title">
                <span class="icon">🗂️</span>
                <h2>Minhas Atividades</h2>
              </div>
              <div class="board-toolbar" id="board-toolbar">
                <label class="form-label" for="board-select">Ver quadro de:</label>
                <select id="board-select" class="form-input board-select">
                  <option value="__self__">Minhas atividades</option>
                </select>
                <button id="btn-nova-atividade" class="btn btn-primary btn-sm">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Nova Atividade
                </button>
              </div>
            </div>

            <div id="board-progresso" class="board-progresso"></div>

            <div class="agenda-semana-nav">
              <button type="button" id="btn-semana-anterior" class="btn btn-secondary btn-sm">‹ Semana anterior</button>
              <span id="agenda-semana-label" class="agenda-semana-label"></span>
              <button type="button" id="btn-semana-proxima" class="btn btn-secondary btn-sm">Próxima semana ›</button>
            </div>

            <div id="agenda-semana" class="agenda-semana"></div>
            <div id="agenda-sem-data-aviso" class="agenda-sem-data-aviso hidden"></div>

            <div class="agenda-concluidas-header">
              <button type="button" id="btn-toggle-concluidas" class="btn btn-secondary btn-sm">
                Atividades concluídas (<span id="concluidas-contador">0</span>)
              </button>
              <select id="concluidas-periodo" class="form-input hidden" style="width:auto; display:inline-block;">
                <option value="semana">Esta semana</option>
                <option value="mes">Este mês</option>
                <option value="semestre">Este semestre</option>
                <option value="ano">Este ano</option>
                <option value="tudo">Tudo</option>
              </select>
            </div>
            <div id="agenda-concluidas" class="agenda-concluidas hidden"></div>
          </section>
        </main>

      </div>
    </div>
  </div>

  <!-- Modal para Nova Atividade -->
  <div id="modal-atividade" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="atividade-modal-title">Nova Atividade</h3>
        <button class="modal-close" onclick="fecharModal('modal-atividade')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="form-atividade">
        <div class="form-group hidden" id="atividade-para-wrap">
          <label class="form-label">Para (pode marcar mais de uma pessoa)</label>
          <div id="atividade-uid-lista" class="checkbox-lista"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Título *</label>
          <input type="text" id="atividade-titulo" class="form-input" placeholder="Ex: Treinamento sobre X" required>
        </div>
        <div class="form-group">
          <label class="form-label">Descrição</label>
          <textarea id="atividade-descricao" class="form-input" rows="2" placeholder="Detalhes da atividade (opcional)"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Dia e horário *</label>
          <input type="datetime-local" id="atividade-prazo" class="form-input" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="fecharModal('modal-atividade')">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar Atividade</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module" src="/meu-espaco/meu-espaco.js"></script>
</body>
</html>
