<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processos do Setor · Órbita Fatec</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/core/layout.css">
  <link rel="stylesheet" href="/meu-espaco/meu-espaco.css">
  <link rel="stylesheet" href="/meu-espaco/processos/processos.css">
</head>
<body>
  <div class="particles"></div>

  <div id="auth-guard" class="layout-auth-guard">
    <div class="layout-spinner"></div>
    <h3 style="color:var(--text-main); font-weight:600;">Autenticando...</h3>
  </div>

  <div id="app" class="layout-wrapper hidden">
    <div class="layout-main">
      <div class="layout-content">
        <main class="mod-main" id="main-content">
          <div class="welcome-section">
            <h1 class="page-title" id="page-title">Processos do Setor</h1>
            <p class="page-subtitle" id="page-subtitle">Cadastre o "norte" de execução de cada rotina do setor e atribua a quem deve executá-la.</p>
          </div>

          <!-- Visão do Chefe de Setor / ADM: CRUD completo -->
          <div id="gestor-view">
            <div class="proc-toolbar" id="proc-toolbar">
              <!-- Admin: seletor de setor. Chefe: fixo, sem seletor. Renderizado via JS -->
              <div id="proc-setor-select-wrap" class="hidden"></div>
              <label class="form-label" for="ver-como-select" style="margin:0;">Ver como:</label>
              <select id="ver-como-select" class="form-input" style="width:auto; display:inline-block;">
                <option value="">— Gerenciar (minha visão) —</option>
              </select>
              <a href="/meu-espaco/index.html" class="btn btn-secondary btn-sm">Ver Painel do Setor</a>
              <button id="btn-novo-processo" class="btn btn-primary btn-sm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Novo Processo
              </button>
            </div>

            <div id="processos-grid" class="processos-grid">
              <div class="loading-state">Carregando processos...</div>
            </div>

            <!-- Visão somente-leitura de "como o funcionário vê", ativada pelo seletor acima -->
            <div id="vercomo-grouped" class="hidden"></div>
          </div>

          <!-- Visão do funcionário comum: só leitura, agrupado por recorrência -->
          <div id="funcionario-view" class="hidden">
            <div id="meus-processos-grouped">
              <div class="loading-state">Carregando seus processos...</div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- Modal Novo/Editar Processo -->
  <div id="modal-processo" class="modal-overlay">
    <div class="modal-box modal-box-processo">
      <div class="modal-header">
        <h3 class="modal-title" id="processo-modal-title">Novo Processo</h3>
        <button class="modal-close" onclick="fecharModal('modal-processo')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="form-processo">
        <input type="hidden" id="processo-id">
        <div class="form-group">
          <label class="form-label">Título *</label>
          <input type="text" id="processo-titulo" class="form-input" placeholder="Ex: Backup diário dos servidores" required>
        </div>
        <div class="form-group">
          <label class="form-label">Descrição</label>
          <textarea id="processo-descricao" class="form-input" rows="2" placeholder="Contexto geral do processo..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Recorrência *</label>
          <select id="processo-recorrencia" class="form-input" required>
            <option value="diaria">Diária</option>
            <option value="semanal">Semanal</option>
            <option value="mensal">Mensal</option>
            <option value="bimestral">Bimestral</option>
            <option value="semestral">Semestral</option>
            <option value="anual">Anual</option>
            <option value="conforme_demanda">Conforme Demanda</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Passos (o "norte" da execução)</label>
          <div id="passos-list" class="passos-list"></div>
          <button type="button" id="btn-add-passo" class="btn btn-secondary btn-sm" style="margin-top:0.5rem;">+ Adicionar passo</button>
        </div>
        <div class="form-group">
          <label class="form-label">Atribuir a *</label>
          <div id="atribuidos-list" class="atribuidos-list">
            <div class="loading-state">Carregando funcionários do setor...</div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="fecharModal('modal-processo')">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-save-processo">Salvar Processo</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/meu-espaco/processos/processos.js"></script>
</body>
</html>
